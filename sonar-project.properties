# Análisis local. El token NO va aquí: pásalo en SONAR_TOKEN o -Dsonar.token.
sonar.projectKey=Ecociudad
sonar.projectName=EcoCiudad
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Código propio. No uses sonar.sources=. (incluye vendor y node_modules).
sonar.sources=app,bootstrap/app.php,database,resources,routes,firmware
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,public/build/**,public/hot/**,public/storage/**,storage/**,bootstrap/cache/**,**/*.pdf,coverage.xml,.scannerwork/**,resources/views/docs/**
sonar.coverage.exclusions=database/**,resources/views/**,resources/js/**,firmware/**,bootstrap/**

# PHPUnit clover: php artisan test --coverage-clover=coverage.xml
sonar.php.coverage.reportPaths=coverage.xml
