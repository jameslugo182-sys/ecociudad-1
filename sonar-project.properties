# Analisis local. El token NO va aqui: pasalo en SONAR_TOKEN o -Dsonar.token.
sonar.projectKey=Ecociudad
sonar.projectName=EcoCiudad
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Codigo propio. No uses sonar.sources=. (incluiria vendor y node_modules, que ya ignora .gitignore).
sonar.sources=app,bootstrap/app.php,database,resources,routes,firmware
sonar.tests=tests

# PHPUnit clover: php artisan test --coverage-clover=coverage.xml
sonar.php.coverage.reportPaths=coverage.xml
