# Analisis local. El token NO va aqui: pasalo en SONAR_TOKEN o -Dsonar.token.
sonar.projectKey=Ecociudad
sonar.projectName=EcoCiudad
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Compatible con sonar.sources=. (vendor, node_modules y build quedan fuera por .gitignore).
# Los tests se marcan por patron en lugar de sonar.tests para no indexarlos dos veces.
sonar.sources=.
sonar.test.inclusions=tests/**

# Cobertura (se versionan porque el pipeline de la universidad no ejecuta las pruebas):
#   PHP: XDEBUG_MODE=coverage php artisan test --coverage-clover=coverage.xml
#   JS : npm run cobertura:js
# Despues: node tests/herramientas/normalizar-cobertura.mjs (rutas relativas para Linux).
sonar.php.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
