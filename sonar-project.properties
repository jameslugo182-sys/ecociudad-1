# Analisis local. El token NO va aqui: pasalo en SONAR_TOKEN o -Dsonar.token.
sonar.projectKey=Ecociudad
sonar.projectName=EcoCiudad
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Compatible con sonar.sources=. (vendor, node_modules y build quedan fuera por .gitignore).
# Los tests se marcan por patron en lugar de sonar.tests para no indexarlos dos veces.
sonar.sources=.
sonar.test.inclusions=tests/**

# PHPUnit clover: php artisan test --coverage-clover=coverage.xml
sonar.php.coverage.reportPaths=coverage.xml
