name: ecociudad

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecociudad}
      POSTGRES_USER: ${DB_USERNAME:-ecociudad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecociudad} -d ${DB_DATABASE:-ecociudad}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ecociudad-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "true"
      SEED_ADMIN: ${SEED_ADMIN:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  queue:
    image: ecociudad-app:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "false"
      SEED_ADMIN: "false"
      SEED_DEMO: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--timeout=90"]
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: ecociudad-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - internal

volumes:
  postgres_data:
  laravel_storage:

networks:
  internal:
    driver: bridge
